<svg xmlns="http://www.w3.org/2000/svg" width="960" height="792" viewBox="0 0 960 792" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="792" fill="#ffffff"/>

  <!-- Kubernetes vertical bar -->
