  <text x="828" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Topograph</text>

  <rect x="744" y="476" width="168" height="84" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="828" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">NetQ</text>

