  <text x="416" y="466" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#312E81">Traffic</text>
  <text x="416" y="486" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#312E81">Observability</text>
