  <rect x="352" y="662" width="284" height="92" rx="8" fill="#ffffff" stroke="#E5D68A" stroke-width="1.5"/>
  <text x="494" y="698" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Scale-up Network</text>
  <text x="494" y="722" text-anchor="middle" font-size="12" fill="#64748B">NVLink · NVSwitch</text>

  <rect x="656" y="662" width="256" height="92" rx="8" fill="#ffffff" stroke="#E5D68A" stroke-width="1.5"/>
  <text x="784" y="698" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Storage Network</text>
